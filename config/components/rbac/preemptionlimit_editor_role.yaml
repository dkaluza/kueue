# permissions for end users to edit preemptionlimits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preemptionlimit-editor-role
  labels:
    rbac.kueue.x-k8s.io/role: "preemptionlimit-editor"
    rbac.kueue.x-k8s.io/batch-admin: "true"
rules:
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - preemptionlimits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - preemptionlimits/status
  verbs:
  - get
